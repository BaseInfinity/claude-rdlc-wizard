name: Release

# Triggers on a tag push of the form v* (e.g. v0.3.3).
# To cut a release:
#   1. bump version in package.json + RDLC.md + CHANGELOG.md
#   2. commit with conventional message
#   3. git tag vX.Y.Z && git push origin main vX.Y.Z
#   4. this workflow runs tests, publishes to npm with provenance, creates GH release
#
# Required secret: NPM_TOKEN (automation token from npmjs.com — bypasses 2FA OTP).
# Set at: Settings → Secrets and variables → Actions → New repository secret.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v0.3.3) — fallback when push-trigger misfires'
        required: true
        type: string

permissions:
  contents: write    # for `gh release create`
  id-token: write    # for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Verify tag is on main branch
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::Tagged commit is not on main branch. Aborting publish."
            exit 1
          }

      - name: Verify tag matches package.json version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="${INPUT_TAG#v}"
          else
            TAG="${GITHUB_REF#refs/tags/v}"
          fi
          PKG=$(node -p "require('./package.json').version")
          [ "$TAG" = "$PKG" ] || {
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          }
          echo "Verified: v$TAG matches package.json"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install jq (needed by tests)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run full test suite (block bad releases)
        run: |
          bash tests/test-cli-init.sh
          bash tests/test-cli-check.sh
          bash tests/test-cli-complexity.sh
          bash tests/test-cli-scan.sh
          bash tests/test-hooks.sh
          bash tests/test-templates.sh

      - name: Publish to npm (with provenance)
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: gh release create "$TAG_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
